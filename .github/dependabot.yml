version: 2
# O Maven saiu daqui: quem cuida das dependências da aplicação é o Renovate
# (.github/renovate.json5), que agrupa e tem painel. O Dependabot fica com a
# infraestrutura, para não abrir PR duplicado. Em ambos, versão nova só depois
# de 7 dias publicada; correção de segurança não espera.
updates:
  # Imagens base fixadas por digest no Dockerfile e no compose.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
