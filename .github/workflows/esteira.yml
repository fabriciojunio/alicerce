name: Esteira

# A esteira que todo serviço copiado deste modelo herda. Cada etapa barra
# sozinha; nenhuma roda com continue-on-error.
#
#   teste      testes de unidade e de segurança da aplicação
#   codigo     segredo no histórico (gitleaks), SAST (Semgrep), SCA (OSV no SBOM)
#   imagem     constrói, varre a imagem (Trivy) e faz DAST (ZAP) no contêiner
#   publicar   só em produção: envia ao GHCR e assina com cosign, sem chave guardada

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teste:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: mvn -B verify
      - name: Testes dos scripts (gerador de VEX)
        run: python3 -m unittest discover -s scripts -p "test_*.py"

  codigo:
    name: Segredos, SAST e SCA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Segredos no histórico (gitleaks)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner -v .
      - name: Análise estática (Semgrep)
        run: |
          pipx run --spec semgrep==1.181.0 semgrep scan --metrics=off --error \
            --config p/java --config p/owasp-top-ten --config p/secrets --config p/security-audit src
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: SBOM (CycloneDX)
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=bom.cdx
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            -L target/bom.cdx.json
      - name: Autoria do histórico
        run: |
          if git log --format=%B | grep -Eiq '^co-authored-by:.*(claude|anthropic)|generated with.*claude'; then
            echo "Commit com coautoria de ferramenta de IA no histórico"
            exit 1
          fi

  imagem:
    name: Imagem, varredura e DAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [teste]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir
        run: docker build -t alicerce:ci .
      - name: Varrer a imagem (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: alicerce:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # O contêiner sobe como sobe em produção: somente leitura, sem
      # capacidade nenhuma e sem escalar privilégio. Se a aplicação precisar
      # gravar em disco, quebra aqui, e não em produção.
      - name: Subir o contêiner
        run: |
          docker run -d --name alicerce -p 8080:8080 --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges:true \
            -e ALICERCE_EMISSOR=https://emissor.exemplo.test/realms/alicerce alicerce:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/actuator/health && exit 0; sleep 2; done
          docker logs alicerce; exit 1
      - name: DAST (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:8080/actuator/health"
          rules_file_name: ".zap/regras.tsv"
          allow_issue_writing: false
          fail_action: true

  publicar:
    name: Publicar e assinar
    if: github.event_name == 'push' && github.ref == 'refs/heads/produção'
    runs-on: ubuntu-latest
    needs: [teste, codigo, imagem]
    permissions:
      contents: read
      packages: write
      # Assinatura sem chave: o cosign troca o token OIDC do GitHub por um
      # certificado de curta duração, e a assinatura fica no registro público
      # de transparência. Ninguém guarda chave privada.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Construir, enviar e assinar
        run: |
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build -t "$imagem" .
          docker push "$imagem"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$imagem")
          cosign sign --yes "$digest"
          echo "Assinada: $digest"
          # VEX: o que o scanner do cliente vai achar no SBOM e não se aplica, e por quê. Sai dos
          # aceites do osv-scanner.toml; sem aceite, o documento vai vazio, o que também é afirmação.
          config=osv-scanner.toml; [ -f "$config" ] || config=/dev/null
          sha="${digest#*@}"
          produto="pkg:oci/alicerce@${sha/:/%3A}?repository_url=ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 scripts/vex.py "$config" "$produto" vex.json
          cosign attest --yes --type openvex --predicate vex.json "$digest"
          echo "VEX anexado como atestado assinado."
