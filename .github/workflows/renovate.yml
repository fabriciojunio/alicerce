name: Renovate

# Renovate self-hosted: roda como job do próprio repositório, sem o app
# hospedado da Mend. Precisa do segredo RENOVATE_TOKEN, um token com permissão
# de abrir pull request aqui. Sem o segredo, o job termina sem fazer nada, em
# vez de falhar. O Dependabot continua cuidando de Docker e GitHub Actions.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Só simula, sem abrir PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir o token
        id: token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "RENOVATE_TOKEN não configurado; nada a fazer."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Renovate
        if: steps.token.outputs.rodar == 'true'
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: info
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate.json5
