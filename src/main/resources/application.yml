spring:
  application:
    name: alicerce
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emissor e audiência vêm do ambiente. O token só é aceito se o
          # emissor bater e se o serviço estiver na audiência: um token válido
          # emitido para outro serviço do mesmo provedor é recusado.
          issuer-uri: ${ALICERCE_EMISSOR:http://localhost:8180/realms/alicerce}
          # O "iss" do token é o endereço público do Keycloak, mas dentro do
          # compose o serviço só alcança o Keycloak pela rede interna. Com o
          # jwk-set-uri definido, as chaves vêm por ele e o "iss" continua
          # conferido contra o issuer-uri.
          jwk-set-uri: ${ALICERCE_JWKS:http://localhost:8180/realms/alicerce/protocol/openid-connect/certs}
          audiences: ${ALICERCE_AUDIENCIA:alicerce-api}

server:
  # Atrás de balanceador, o IP do cliente vem do cabeçalho do proxy confiável.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      # JSON no formato ECS: o correlationId do MDC sai em todo log.
      console: ecs

alicerce:
  seguranca:
    origens-permitidas: ${ALICERCE_ORIGENS:}
    requisicoes-por-minuto: ${ALICERCE_LIMITE:120}
