# CIS Ubuntu 24.04, seção 5.1. As diretivas ficam num arquivo próprio em
# sshd_config.d, que o Ubuntu inclui antes do resto: no sshd vale o primeiro
# valor lido. As mesmas diretivas são tiradas dos outros arquivos, para não
# sobrar valor contraditório que um leitor (ou o OpenSCAP) ache primeiro.
- name: Servidor SSH instalado
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Diretivas endurecidas
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-alicerce.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      # Gerado por infra/host/tarefas/ssh.yml. Não editar à mão.
      PermitRootLogin no
      PermitEmptyPasswords no
      IgnoreRhosts yes
      HostbasedAuthentication no
      PermitUserEnvironment no
      UsePAM yes
      LogLevel INFO
      MaxAuthTries 4
      MaxSessions 10
      MaxStartups 10:30:60
      LoginGraceTime 60
      ClientAliveInterval 300
      ClientAliveCountMax 3
      Banner /etc/issue.net
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
  notify: Recarregar o SSH

- name: Outros arquivos de configuração do SSH
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
    excludes: "00-alicerce.conf"
  register: outros_sshd

- name: Tirar dos outros arquivos as diretivas que o 00-alicerce.conf define
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: '(?i)^\s*{{ item.1 }}\s'
    state: absent
  loop: "{{ (['/etc/ssh/sshd_config'] + (outros_sshd.files | map(attribute='path') | list)) | product(diretivas) | list }}"
  vars:
    diretivas: [PermitRootLogin, PermitEmptyPasswords, IgnoreRhosts, HostbasedAuthentication,
                PermitUserEnvironment, UsePAM, LogLevel, MaxAuthTries, MaxSessions, MaxStartups,
                LoginGraceTime, ClientAliveInterval, ClientAliveCountMax, Banner, Ciphers, MACs,
                KexAlgorithms]
  notify: Recarregar o SSH

- name: Permissão da configuração do SSH
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.modo }}"
  loop:
    - { path: /etc/ssh/sshd_config, modo: "0600" }
    - { path: /etc/ssh/sshd_config.d, modo: "0700" }

- name: Chaves do servidor SSH
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*_key*"
  register: chaves_ssh

- name: Chave privada só para o root, chave pública só leitura
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ '0644' if item.path.endswith('.pub') else '0600' }}"
  loop: "{{ chaves_ssh.files }}"
  loop_control:
    label: "{{ item.path }}"

# O sshd -t exige esta pasta, que o systemd só cria quando o serviço sobe; com o
# SSH ativado por socket ela pode não existir ainda.
- name: Pasta de separação de privilégio do sshd
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Configuração inválida derrubaria o próximo acesso remoto: valida antes de
# recarregar. O handler só roda depois deste passo.
- name: Validar a configuração do SSH
  ansible.builtin.command: sshd -t
  changed_when: false
